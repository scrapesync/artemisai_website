<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.site-nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:52px;padding:0 1.6rem;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);background:rgba(6,10,19,0.92);border-bottom:1px solid rgba(255,255,255,0.06);font-family:'DM Sans',sans-serif}
nav.site-nav *{box-sizing:border-box}
.sn-logo{font-size:1rem;font-weight:800;letter-spacing:.12em;color:#e8ecf4;text-decoration:none;display:flex;align-items:center;gap:.55rem;flex-shrink:0}
.sn-logo-mark{width:26px;height:26px;flex-shrink:0}.sn-logo-mark svg{width:100%;height:100%;min-width:0!important}
.sn-links{display:flex;align-items:center;gap:1rem;list-style:none;margin:0;padding:0}
.sn-pill{padding:.4rem 1rem;border:1px solid rgba(0,212,170,.3);border-radius:7px;color:#00d4aa!important;font-size:.8rem;text-decoration:none;background:transparent;transition:all .2s;white-space:nowrap}
.sn-pill:hover{background:rgba(0,212,170,.07)!important;border-color:rgba(0,212,170,.6)!important}
.sn-chip{display:none;align-items:center;gap:7px;padding:.28rem .8rem .28rem .4rem;background:rgba(0,212,170,.07);border:1px solid rgba(0,212,170,.2);border-radius:20px}
.sn-avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#00d4aa,#6366f1);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#060a13;flex-shrink:0}
.sn-name{font-size:.78rem;color:#e8ecf4;font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn-logout{background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:6px;color:rgba(255,255,255,.4);font-family:inherit;font-size:.8rem;padding:.26rem .6rem;cursor:pointer;transition:all .2s}
.sn-logout:hover{border-color:rgba(248,113,113,.4);color:#f87171}
#signout-modal{display:none;position:fixed;inset:0;background:rgba(3,6,12,.7);backdrop-filter:blur(6px);z-index:2000;align-items:center;justify-content:center}
#signout-modal.on{display:flex}
#signout-modal .sm-card{background:#0C1220;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:26px 28px;max-width:340px;text-align:center}
#signout-modal h3{color:#e8ecf4;font-size:16px;margin:0 0 8px;font-family:'DM Sans',sans-serif}
#signout-modal p{color:#8a96ac;font-size:13px;margin:0 0 18px;line-height:1.5}
#signout-modal .sm-row{display:flex;gap:10px;justify-content:center}
#signout-modal button{padding:9px 18px;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit}
#signout-modal .sm-yes{background:#f87171;border:none;color:#12060a}
#signout-modal .sm-no{background:transparent;border:1px solid rgba(255,255,255,.15);color:#c8d0dd}
@media (max-width:640px){.site-nav{height:48px;padding:0 12px}.sn-pill{padding:.3rem .75rem;font-size:.7rem}}
:root{--bg:#060A13;--panel:rgba(255,255,255,.028);--panel2:rgba(255,255,255,.055);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--t1:#E8ECF4;--t2:#A3AFC4;--t3:#8A96AC;--okT:#00D4AA;--badT:#FB5D77;--warnT:#F7BE4F;--skyT:#57B5F0;--indT:#8A96FF;--mono:'JetBrains Mono',ui-monospace,monospace;--grad:linear-gradient(120deg,#00D4AA,#6C7BFB);--aur1:rgba(108,123,251,.07);--aur2:rgba(0,212,170,.05);--tipbg:#0B1120;--track:rgba(255,255,255,.07)}
body.light{--bg:#F3F5FA;--panel:#FFFFFF;--panel2:#EEF1F8;--line:rgba(14,21,36,.09);--line2:rgba(14,21,36,.17);--t1:#101828;--t2:#3E4C63;--t3:#5C6A83;--okT:#067A60;--badT:#C2274B;--warnT:#8F6400;--skyT:#1F6FA8;--indT:#4650C9;--grad:linear-gradient(120deg,#0B8A6F,#4650C9);--aur1:rgba(70,80,201,.06);--aur2:rgba(11,138,111,.06);--tipbg:#FFFFFF;--track:rgba(14,21,36,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1200px 500px at 80% -10%,var(--aur1),transparent 60%),radial-gradient(900px 420px at 8% 0%,var(--aur2),transparent 55%),var(--bg);color:var(--t1);font-family:'DM Sans',sans-serif;padding-top:52px;min-height:100vh}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
button:focus-visible{outline:2px solid var(--okT);outline-offset:2px;border-radius:8px}
.wrap{max-width:1520px;margin:0 auto;padding:26px 30px 90px}
.ph{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.ph .kick{font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;margin-bottom:7px}
.ph h1{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1}
.ph h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ph .sub{font-size:12.5px;color:var(--t2);margin-top:8px}
.ph .tools{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.tbtn{font-size:12px;font-weight:800;padding:9px 15px;border-radius:11px;border:1px solid var(--line);color:var(--t2);transition:.15s;background:var(--panel)}
.tbtn:hover{color:var(--t1);border-color:var(--line2)}
.tbtn.pri{background:var(--grad);color:#fff;border:none}
body:not(.light) .tbtn.pri{color:#04110D}
#freshness{font-family:var(--mono);font-weight:700;font-size:11px;color:var(--okT)}
#liveProgress{display:none;margin-bottom:14px}
.lpbarwrap{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
#lpBar{height:100%;width:0%;background:var(--grad);border-radius:99px;transition:width .4s ease}
.layout{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:66px;max-height:calc(100vh - 90px);overflow-y:auto}
.sb-search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--t1);font-family:inherit;font-size:12px;padding:8px 10px;margin-bottom:10px}
.sb-group{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin:12px 8px 6px}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:12.5px;color:var(--t2);transition:.12s;width:100%;text-align:left}
.sb-item:hover{background:var(--panel2);color:var(--t1)}
.sb-item.on{background:var(--panel2);color:var(--t1);box-shadow:inset 2px 0 0 var(--okT)}
.sb-item .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--t3)}
.main{min-width:0}
.thead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.thead h2{font-size:20px;font-weight:800}
.thead .meta{font-family:var(--mono);font-size:11.5px;color:var(--t3)}
.thead .schema-badge{font-size:10px;font-weight:800;font-family:var(--mono);padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--indT)}
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.vtab{font-size:12.5px;font-weight:800;padding:9px 15px;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px}
.vtab.on{color:var(--t1);border-bottom-color:var(--okT)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden}
.gridwrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}
table.grid th{position:sticky;top:0;background:var(--panel2);font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--t3);text-align:left;font-weight:800;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line2)}
table.grid th .ty{color:var(--indT);font-weight:600;font-family:var(--mono);text-transform:none;letter-spacing:0}
table.grid td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--t2);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:11.5px}
table.grid tr:hover td{background:var(--panel2)}
.searchrow{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.searchrow input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--t1);font-family:var(--mono);font-size:11.5px;padding:7px 9px;flex:1;min-width:140px}
.searchrow .cnt{font-family:var(--mono);font-size:11px;color:var(--t3)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sumcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.sumcard h4{font-size:12.5px;font-weight:800;margin-bottom:2px;display:flex;align-items:center;gap:7px}
.sumcard .ck{font-size:9px;font-weight:800;font-family:var(--mono);text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--indT)}
.sumcard .st{font-family:var(--mono);font-size:10.5px;color:var(--t3);margin-bottom:10px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bar .lb{font-size:11px;color:var(--t2);width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tk{flex:1;height:9px;background:var(--track);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;background:var(--grad);border-radius:99px}
.bar .vn{font-family:var(--mono);font-size:10.5px;color:var(--t1);width:52px;text-align:right}
.histo{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:8px}
.histo .hb{flex:1;background:var(--indT);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.histo-lab{display:flex;gap:4px;margin-top:4px}
.histo-lab span{flex:1;font-size:8.5px;color:var(--t3);text-align:center;font-family:var(--mono);overflow:hidden}
.numrow{display:flex;gap:16px;margin-top:4px}
.numrow div{font-size:11px;color:var(--t3)}.numrow b{font-family:var(--mono);color:var(--t1);font-weight:700;display:block;font-size:14px}
.empty{padding:40px;text-align:center;color:var(--t3);font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);background:var(--tipbg);border:1px solid var(--line2);color:var(--t1);font-size:12.5px;font-weight:700;padding:11px 19px;border-radius:12px;transition:.3s;z-index:90;box-shadow:0 18px 50px -12px rgba(0,0,0,.4)}
.toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:880px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:300px}}

/* ===== grid toolbar: filters, sort, selection, export ===== */
.gtools{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.gtools input.q{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--t1);font-family:var(--mono);font-size:11.5px;padding:7px 9px;flex:1;min-width:150px}
.gbtn{font-size:11.5px;font-weight:800;padding:7px 12px;border-radius:9px;border:1px solid var(--line);color:var(--t2);background:var(--panel2)}
.gbtn:hover{color:var(--t1);border-color:var(--line2)}
.gbtn.on{border-color:var(--okT);color:var(--okT)}
.gcnt{font-family:var(--mono);font-size:11px;color:var(--t3);margin-left:auto}
.fbar{padding:0 13px 11px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fchip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:99px;padding:5px 6px 5px 11px;font-size:11.5px;color:var(--t2)}
.fchip b{color:var(--t1);font-weight:700}
.fchip em{font-style:normal;color:var(--indT);font-family:var(--mono);font-size:10.5px}
.fchip button{width:18px;height:18px;border-radius:50%;color:var(--t3);font-size:13px;line-height:1;display:grid;place-items:center}
.fchip button:hover{background:rgba(251,93,119,.16);color:var(--badT)}
.fbuild{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 13px 11px}
.fbuild select,.fbuild input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--t1);font-family:inherit;font-size:11.5px;padding:6px 8px}
.fbuild input{font-family:var(--mono);min-width:110px}
table.grid th.sortable{cursor:pointer;user-select:none}
table.grid th.sortable:hover{color:var(--t1)}
table.grid th .sarr{color:var(--okT);font-size:10px;margin-left:4px}
table.grid th.selcol,table.grid td.selcol{width:34px;text-align:center;padding-left:10px;padding-right:6px}
table.grid tr.sel td{background:rgba(0,212,170,.09)}
input[type=checkbox]{accent-color:#00D4AA;cursor:pointer}

/* export dialog */
#exp-modal{display:none;position:fixed;inset:0;z-index:2100;align-items:center;justify-content:center}
#exp-modal.on{display:flex}
#exp-back{position:absolute;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(5px)}
#exp-card{position:relative;z-index:1;background:var(--tipbg);border:1px solid var(--line2);border-radius:16px;padding:22px 24px;max-width:500px;width:92%;box-shadow:0 30px 60px rgba(0,0,0,.5)}
#exp-card h3{font-size:16.5px;font-weight:800;margin-bottom:4px}
#exp-card p.sub{font-size:12px;color:var(--t3);line-height:1.55;margin-bottom:14px}
#exp-card label.lb{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);font-weight:800;margin:13px 0 5px}
#exp-card select,#exp-card input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--t1);font-family:inherit;font-size:12.5px;padding:8px 10px}
.expnote{font-size:11.5px;color:var(--t3);line-height:1.5;margin-top:9px;padding:9px 11px;border-radius:9px;background:var(--panel2);border-left:2px solid var(--indT)}
#exp-btns{display:flex;gap:8px;margin-top:18px}
#exp-btns button{flex:1;padding:10px;border-radius:10px;font-weight:800;font-size:12.5px}
#exp-cancel{background:transparent;border:1px solid var(--line2);color:var(--t2)}
#exp-go{background:var(--grad);border:none;color:#04110D}
body.light #exp-go{color:#fff}
</style>
</head>
<body>
<nav class="site-nav">
  <a href="index.html" class="sn-logo">
    <div class="sn-logo-mark"><svg viewBox="0 0 36 36" fill="none"><rect x="2" y="2" width="32" height="32" rx="8" stroke="url(#slg)" stroke-width="2"/><path d="M18 8L26 28H10L18 8Z" stroke="url(#slg)" stroke-width="1.5" fill="none"/><circle cx="18" cy="20" r="3" fill="url(#slg)"/><defs><linearGradient id="slg" x1="4" y1="4" x2="32" y2="32"><stop stop-color="#00d4aa"/><stop offset="1" stop-color="#00a88a"/></linearGradient></defs></svg></div>
    ARTEMISAI
  </a>
  <ul class="sn-links">

    <div class="signout-title">Sign out?</div>

<script>(function(){
  try{
    var sess = localStorage.getItem('artemis_session') || localStorage.getItem('artemis_sprint_session') || localStorage.getItem('artemis_app_session');
    if(sess){
      var user = JSON.parse(sess);
      var chip=document.getElementById('sn-chip'), av=document.getElementById('sn-avatar'), nm=document.getElementById('sn-name'), lb=document.getElementById('sn-logout-btn');
      if(chip) chip.style.display='flex';
      var who=user.name||user.username||'';
      if(av && who) av.textContent=who.charAt(0).toUpperCase();
      if(nm && who) nm.textContent=who;
      if(lb) lb.style.display='';
    }
  }catch(e){}
})();
var _signoutFn=null;
function handleLogout(){_showSignoutModal(function(){localStorage.removeItem('artemis_session');localStorage.removeItem('artemis_sprint_session');localStorage.removeItem('artemis_app_session');localStorage.removeItem('artemis_viewer_name');window.location.href='index.html';});}
function _showSignoutModal(fn){_signoutFn=fn||function(){localStorage.removeItem('artemis_session');window.location.href='index.html';};document.getElementById('signout-modal').classList.add('open');}
function _closeSignoutModal(){document.getElementById('signout-modal').classList.remove('open');}
function _doSignout(){_closeSignoutModal();if(_signoutFn)_signoutFn();}</script>
<script>
const REPO='scrapesync/artemisai_website';
const LIVE_ENDPOINT='/api/fetch-live-explorer', SAVE_FILE='explorer_data.json';
let DATA={tables:[]}, META={source:'seed'}, CUR=null, VIEW='preview', THEME='dark', GREP='';

async function loadData(){
  try{
    const r=await fetch(SAVE_FILE+'?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) return false;
    const j=await r.json();
    if(j&&Array.isArray(j.tables)){ DATA=j; META={source:'live',generated_at:j.generated_at}; return true; }
    return false;
  }catch(e){ return false; }
}
function stampFreshness(){
  const el=document.getElementById('freshness');if(!el)return;
  if(META.source==='live'&&META.generated_at){
    const d=new Date(META.generated_at);const ageH=(Date.now()-d.getTime())/3.6e6;
    const ago=ageH<1?Math.round(ageH*60)+'m ago':(ageH<48?Math.round(ageH)+'h ago':Math.round(ageH/24)+'d ago');
    el.textContent='snapshot '+d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' · '+ago;
    el.style.color=ageH>26?'var(--warnT)':'var(--okT)';
  } else { el.textContent='demo data'; el.style.color='var(--t3)'; }
}
function fmtN(v){if(typeof v!=='number')return v;if(v>=1e6)return(v/1e6).toFixed(1)+'M';if(v>=1e3)return(v/1e3).toFixed(1)+'k';return v%1===0?v:v.toFixed(1);}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function renderSidebar(){
  GREP=(document.getElementById('tblSearch').value||'').toLowerCase();

    }
  }
  document.getElementById('sbList').innerHTML=html||'<div class="empty" style="padding:16px">No tables match.</div>';
}
function selectTable(id){CUR=id;VIEW='preview';resetGrid();renderSidebar();renderMain();}
function tableById(id){return DATA.tables.find(t=>t.schema+'.'+t.table===id);}

function renderMain(){
  const m=document.getElementById('main');
  if(!CUR){ m.innerHTML='<div class="empty">Select a table from the left to explore its data.</div>'; return; }

    <div class="vtabs">

      <button class="vtab ${VIEW==='summary'?'on':''}" onclick="setView('summary')">Summaries</button>
      <button class="vtab ${VIEW==='schema'?'on':''}" onclick="setView('schema')">Schema</button>
    </div>
    <div id="viewBody"></div>`;

function setView(v){VIEW=v;document.querySelectorAll('.vtab').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase().startsWith(v)));renderView();}

function renderView(){
  const t=tableById(CUR);const vb=document.getElementById('viewBody');if(!vb)return;
  if(VIEW==='preview') vb.innerHTML=previewHTML(t);
  else if(VIEW==='summary') vb.innerHTML=summaryHTML(t);
  else vb.innerHTML=schemaHTML(t);
  if(VIEW==='preview'){

/* =======================================================================
   PREVIEW GRID: per-column typed filters, sorting, selection, export
   ======================================================================= */
var SORT={col:null,dir:0}, FILTERS=[], SELECTED=new Set(), GRIDQ='';
function resetGrid(){ SORT={col:null,dir:0}; FILTERS=[]; SELECTED=new Set(); GRIDQ=''; }

/* A Redshift type decides how a column is compared, filtered and sorted.
   Getting this wrong is how "9" ends up sorting above "10" and how a date
   filter silently does string matching. */
function kindOf(pgType){
  var s=String(pgType||'').toLowerCase();
  if(/bool/.test(s)) return 'bool';
  if(/timestamp|date|time/.test(s)) return 'date';
  if(/int|numeric|decimal|double|real|float|money/.test(s)) return 'num';
  return 'text';
}
var OPS={
  text:[['contains','contains'],['ncontains','does not contain'],['eq','is exactly'],['starts','starts with'],['ends','ends with'],['empty','is empty'],['nempty','is not empty']],
  num :[['eq','='],['ne','is not'],['gt','greater than'],['gte','at least'],['lt','less than'],['lte','at most'],['between','between'],['empty','is empty'],['nempty','is not empty']],
  date:[['on','on'],['before','before'],['after','after'],['between','between'],['empty','is empty'],['nempty','is not empty']],
  bool:[['true','is true'],['false','is false'],['empty','is empty'],['nempty','is not empty']]
};
var NEEDS2={between:1};
var NEEDS0={empty:1,nempty:1,'true':1,'false':1};

function colKind(t,name){
  var c=(t.columns||[]).filter(function(x){return x.name===name;})[0];
  return kindOf(c&&c.type);
}
function isEmptyVal(v){ return v==null || v===''; }
function asNum(v){ if(isEmptyVal(v)) return null; var n=Number(v); return isNaN(n)?null:n; }
function asDate(v){ if(isEmptyVal(v)) return null; var d=Date.parse(String(v)); return isNaN(d)?null:d; }
function asBool(v){ if(v===true||v===false) return v; var s=String(v).toLowerCase(); return s==='true'?true:s==='false'?false:null; }

function passFilter(val, kind, f){
  if(f.op==='empty')  return isEmptyVal(val);
  if(f.op==='nempty') return !isEmptyVal(val);
  if(kind==='bool'){ var b=asBool(val); return f.op==='true' ? b===true : b===false; }
  if(kind==='num'){
    var n=asNum(val); if(n===null) return false;
    var a=Number(f.v1), b2=Number(f.v2);
    if(f.op==='between') return n>=Math.min(a,b2) && n<=Math.max(a,b2);
    if(f.op==='eq') return n===a;
    if(f.op==='ne') return n!==a;
    if(f.op==='gt') return n>a;
    if(f.op==='gte') return n>=a;
    if(f.op==='lt') return n<a;
    if(f.op==='lte') return n<=a;
    return true;
  }
  if(kind==='date'){
    var d=asDate(val); if(d===null) return false;
    var x=asDate(f.v1), y=asDate(f.v2);
    if(f.op==='on'){ if(x===null) return true;
      return new Date(d).toISOString().slice(0,10)===new Date(x).toISOString().slice(0,10); }
    if(f.op==='before') return x!==null && d<x;
    if(f.op==='after')  return x!==null && d>x;
    if(f.op==='between') return x!==null && y!==null && d>=Math.min(x,y) && d<=Math.max(x,y);
    return true;
  }
  var s=String(val==null?'':val).toLowerCase(), q=String(f.v1==null?'':f.v1).toLowerCase();
  if(f.op==='contains')  return s.indexOf(q)>=0;
  if(f.op==='ncontains') return s.indexOf(q)<0;
  if(f.op==='eq')        return s===q;
  if(f.op==='starts')    return s.lastIndexOf(q,0)===0;
  if(f.op==='ends')      return q==='' || s.slice(-q.length)===q;
  return true;
}

/* The rows currently on screen: free-text search, then every filter (ANDed),
   then the sort. Row identity is the index into t.preview so that a selection
   survives a re-sort. */
function viewRows(t){
  var cols=t.preview_cols||[], all=t.preview||[];
  var idx=cols.reduce(function(m,c,i){ m[c]=i; return m; },{});
  var out=[];
  for(var i=0;i<all.length;i++){
    var r=all[i];
    if(GRIDQ){
      var hit=false;
      for(var j=0;j<r.length;j++){ if(String(r[j]==null?'':r[j]).toLowerCase().indexOf(GRIDQ)>=0){ hit=true; break; } }
      if(!hit) continue;
    }
    var ok=true;
    for(var k=0;k<FILTERS.length;k++){
      var f=FILTERS[k], ci=idx[f.col];
      if(ci===undefined) continue;
      if(!passFilter(r[ci], colKind(t,f.col), f)){ ok=false; break; }
    }
    if(ok) out.push({i:i, r:r});
  }
  if(SORT.col!=null && SORT.dir){
    var ci2=idx[SORT.col], kind=colKind(t,SORT.col), dir=SORT.dir;
    out.sort(function(a,b){
      var va=a.r[ci2], vb=b.r[ci2];
      var ea=isEmptyVal(va), eb=isEmptyVal(vb);
      if(ea&&eb) return 0;
      if(ea) return 1;              // empties sink, whichever direction
      if(eb) return -1;
      var x,y;
      if(kind==='num'){ x=asNum(va); y=asNum(vb); }
      else if(kind==='date'){ x=asDate(va); y=asDate(vb); }
      else if(kind==='bool'){ x=asBool(va)?1:0; y=asBool(vb)?1:0; }
      else { x=String(va).toLowerCase(); y=String(vb).toLowerCase();
             return dir*x.localeCompare(y, undefined, {numeric:true}); }
      return x<y?-dir:x>y?dir:0;
    });
  }
  return out;
}

function previewHTML(t){
  var cols=t.preview_cols||[], rows=t.preview||[];
  if(!rows.length) return '<div class="panel"><div class="empty">No preview rows in snapshot for this table.</div></div>';
  return '<div class="panel">'
    + '<div class="gtools">'
      + '<input class="q" id="gridSearch" placeholder="Search all ' + cols.length + ' columns…" value="' + esc(GRIDQ) + '">'
      + '<button class="gbtn" onclick="toggleBuilder()" id="fAddBtn">+ Add column filter</button>'
      + '<button class="gbtn" onclick="clearGrid()">Reset</button>'
      + '<button class="gbtn on" onclick="openExport()">&#8681; Download</button>'
      + '<span class="gcnt" id="gridCnt"></span>'
    + '</div>'
    + '<div class="fbar" id="fBar"></div>'
    + '<div class="fbuild" id="fBuild" style="display:none"></div>'
    + '<div class="gridwrap"><table class="grid"><thead><tr id="gridHead"></tr></thead><tbody id="gridBody"></tbody></table></div>'
    + '<div id="gridEmpty" style="display:none"></div>'
    + '<div style="padding:10px 13px;font-size:10.5px;color:var(--t3)" id="gridFoot"></div>'
  + '</div>';
}

function paintGrid(){
  var t=tableById(CUR); if(!t) return;
  var cols=t.preview_cols||[], all=t.preview||[], view=viewRows(t);
  var types={}; (t.columns||[]).forEach(function(c){ types[c.name]=c.type; });

  var allSel = view.length>0 && view.every(function(o){ return SELECTED.has(o.i); });
  var head='<th class="selcol"><input type="checkbox" id="selAll" ' + (allSel?'checked':'') + ' onclick="toggleAll(this.checked)" title="Select every row shown"></th>';
  head += cols.map(function(c){
    var arrow = SORT.col===c ? '<span class="sarr">' + (SORT.dir>0?'&#9650;':'&#9660;') + '</span>' : '';
    return '<th class="sortable" onclick="sortBy(' + JSON.stringify(c).replace(/"/g,'&quot;') + ')" title="Sort by ' + esc(c) + '">'
      + esc(c) + arrow + '<div class="ty">' + esc(types[c]||'') + '</div></th>';
  }).join('');
  document.getElementById('gridHead').innerHTML=head;

  document.getElementById('gridBody').innerHTML = view.map(function(o){
    var chk = SELECTED.has(o.i);
    return '<tr class="' + (chk?'sel':'') + '"><td class="selcol"><input type="checkbox" ' + (chk?'checked':'')
      + ' onclick="toggleRow(' + o.i + ',this.checked)"></td>'
      + o.r.map(function(v){ return '<td title="' + esc(v) + '">' + esc(v) + '</td>'; }).join('') + '</tr>';
  }).join('');

  /* The empty state lives outside the table on purpose. Inside it, a centred
     message in a td spanning 31 columns is centred across the full scroll width
     of the grid, which puts it several thousand pixels off the right of the
     viewport: present in the DOM, readable to innerText, and invisible to the
     person wondering why the screen went blank. */
  var emptyEl=document.getElementById('gridEmpty');
  if(view.length){ emptyEl.style.display='none'; }
  else {
    emptyEl.style.display='block';
    emptyEl.innerHTML='<div class="empty">No rows match '
      + (FILTERS.length ? ('these ' + FILTERS.length + ' filter' + (FILTERS.length>1?'s':'')) : 'this search')
      + '.<br><button class="gbtn" style="margin-top:11px" onclick="clearGrid()">Clear and start again</button></div>';
  }

  document.getElementById('gridCnt').textContent =
    view.length + ' of ' + all.length + ' rows' + (SELECTED.size ? '  ·  ' + SELECTED.size + ' selected' : '');
  document.getElementById('gridFoot').textContent =
    'These ' + all.length + ' rows are the snapshot preview. Filtering, sorting and selecting happen here in the browser; Download can also pull a larger, filtered extract straight from Redshift.';
  renderChips();
}

function sortBy(c){
  if(SORT.col!==c){ SORT={col:c,dir:1}; }
  else if(SORT.dir===1){ SORT.dir=-1; }
  else { SORT={col:null,dir:0}; }     // third click clears, so you can get back to load order
  paintGrid();
}
function toggleRow(i,on){ if(on) SELECTED.add(i); else SELECTED.delete(i); paintGrid(); }
function toggleAll(on){
  var t=tableById(CUR); if(!t) return;
  viewRows(t).forEach(function(o){ if(on) SELECTED.add(o.i); else SELECTED.delete(o.i); });
  paintGrid();
}
function clearGrid(){
  resetGrid();
  var s=document.getElementById('gridSearch'); if(s) s.value='';
  var b=document.getElementById('fBuild'); if(b) b.style.display='none';
  paintGrid();
}

/* ---------- filter chips ---------- */
function renderChips(){
  var bar=document.getElementById('fBar'); if(!bar) return;
  if(!FILTERS.length){ bar.innerHTML=''; return; }
  bar.innerHTML=FILTERS.map(function(f,i){
    var label=(OPS[f.kind].filter(function(o){return o[0]===f.op;})[0]||['',f.op])[1];
    var val = NEEDS0[f.op] ? '' : (NEEDS2[f.op] ? ' <b>' + esc(f.v1) + '</b> and <b>' + esc(f.v2) + '</b>' : ' <b>' + esc(f.v1) + '</b>');
    return '<span class="fchip"><em>' + esc(f.col) + '</em> ' + esc(label) + val
      + '<button onclick="dropFilter(' + i + ')" title="Remove">&times;</button></span>';
  }).join('');
}
function dropFilter(i){ FILTERS.splice(i,1); paintGrid(); }

function toggleBuilder(){
  var b=document.getElementById('fBuild');
  if(b.style.display==='none'){ b.style.display='flex'; renderBuilder(); } else { b.style.display='none'; }
}
function renderBuilder(){
  var t=tableById(CUR); if(!t) return;
  var cols=t.preview_cols||[];
  var sel=document.getElementById('fCol');
  var col=sel?sel.value:cols[0];
  if(cols.indexOf(col)<0) col=cols[0];
  var kind=colKind(t,col);
  var opSel=document.getElementById('fOp');
  var op=(opSel && opSel.dataset.forCol===col) ? opSel.value : OPS[kind][0][0];
  if(!OPS[kind].some(function(o){ return o[0]===op; })) op=OPS[kind][0][0];

  var inputType = kind==='num' ? 'number' : kind==='date' ? 'date' : 'text';
  var v1 = NEEDS0[op] ? '' : '<input id="fV1" type="' + inputType + '" placeholder="value">';
  var v2 = NEEDS2[op] ? '<input id="fV2" type="' + inputType + '" placeholder="and">' : '';

  document.getElementById('fBuild').innerHTML =
      '<select id="fCol" onchange="renderBuilder()">'
    + cols.map(function(c){ return '<option value="' + esc(c) + '"' + (c===col?' selected':'') + '>' + esc(c) + '</option>'; }).join('')
    + '</select>'
    + '<select id="fOp" data-for-col="' + esc(col) + '" onchange="renderBuilder()">'
    + OPS[kind].map(function(o){ return '<option value="' + o[0] + '"' + (o[0]===op?' selected':'') + '>' + o[1] + '</option>'; }).join('')
    + '</select>' + v1 + v2
    + '<button class="gbtn on" onclick="addFilter()">Apply</button>'
    + '<span style="font-size:11px;color:var(--t3)">' + esc(col) + ' is <b style="color:var(--indT)">' + kind + '</b></span>';
  var o=document.getElementById('fOp'); if(o) o.dataset.forCol=col;
}
function addFilter(){
  var t=tableById(CUR); if(!t) return;
  var col=document.getElementById('fCol').value, op=document.getElementById('fOp').value;
  var kind=colKind(t,col);
  var v1el=document.getElementById('fV1'), v2el=document.getElementById('fV2');
  var v1=v1el?v1el.value:'', v2=v2el?v2el.value:'';
  if(!NEEDS0[op] && v1===''){ toast('Enter a value to filter on.'); return; }
  if(NEEDS2[op] && v2===''){ toast('Enter both ends of the range.'); return; }
  FILTERS.push({col:col, op:op, kind:kind, v1:v1, v2:v2});
  document.getElementById('fBuild').style.display='none';
  paintGrid();
}

/* ---------- export ---------- */
function openExport(){
  var t=tableById(CUR); if(!t) return;
  var view=viewRows(t), all=(t.preview||[]).length;
  var sc=document.getElementById('expScope');
  sc.innerHTML =
      '<option value="view">Rows shown after filtering (' + view.length + ')</option>'
    + '<option value="sel"' + (SELECTED.size?'':' disabled') + '>Only the rows I ticked (' + SELECTED.size + ')</option>'
    + '<option value="all">Every preview row (' + all + ')</option>'
    + '<option value="live">Pull a bigger extract from Redshift</option>';
  document.getElementById('exp-modal').classList.add('on');
  expScopeChanged();
}
function closeExport(){ document.getElementById('exp-modal').classList.remove('on'); }
/* Sorting in the warehouse is the expensive part. Measured on production:
   filtering odl.dim_comments takes about a second, but ORDER BY on the same
   2.7M rows takes nineteen, which is inside the query service's twenty second
   ceiling only when nothing else is happening. So the cost is stated before the
   click rather than discovered as a failure after it. */
var BIG_TABLE = 250000;
function expScopeChanged(){
  var live=document.getElementById('expScope').value==='live';
  var t=tableById(CUR)||{};
  document.getElementById('expLiveWrap').style.display=live?'block':'none';
  var note;
  if(!live){
    note='Comes from the snapshot already loaded in your browser, so it downloads instantly and holds at most the '
       + ((t.preview||[]).length) + ' preview rows.';
  } else {
    note='Runs a SELECT against Redshift with the same filters and sort, so you get real rows rather than the '
       + ((t.preview||[]).length) + ' held in the snapshot. Capped at 5,000 rows by the query service, and it needs the deployed site.';
    if(SORT.col && SORT.dir && (t.rows||0) > BIG_TABLE){
      note += '<br><br><b style="color:var(--warnT)">This table has ' + fmtN(t.rows) + ' rows and you have it sorted by '
           + esc(SORT.col) + '.</b> Sorting that many rows in the warehouse can exceed the 20 second query limit. '
           + 'If it does, you will be offered the same extract without the sort.';
    }
  }
  document.getElementById('expNote').innerHTML=note;
}

function toCSV(cols, rows, sep){
  var q=function(v){
    var s=v==null?'':String(v);
    return (s.indexOf(sep)>=0||s.indexOf('"')>=0||/[\r\n]/.test(s)) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  return [cols.map(q).join(sep)].concat(rows.map(function(r){ return r.map(q).join(sep); })).join('\n');
}
function toObjects(cols, rows){
  return rows.map(function(r){ var o={}; cols.forEach(function(c,i){ o[c]=r[i]; }); return o; });
}
function download(text, mime, name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
}
function serialise(cols, rows, fmt, base){
  if(fmt==='csv')    return [toCSV(cols,rows,','),  'text/csv', base+'.csv'];
  if(fmt==='tsv')    return [toCSV(cols,rows,'\t'), 'text/tab-separated-values', base+'.tsv'];
  if(fmt==='ndjson') return [toObjects(cols,rows).map(function(o){ return JSON.stringify(o); }).join('\n'), 'application/x-ndjson', base+'.ndjson'];
  return [JSON.stringify(toObjects(cols,rows), null, 2), 'application/json', base+'.json'];
}

/* Push the filters down to SQL so a live extract means the same thing the screen
   shows. Identifiers are checked against the real column list and literals are
   escaped, because this builds a statement rather than binding parameters. */
function sqlLiteral(v){ return "'" + String(v==null?'':v).replace(/'/g, "''") + "'"; }
function sqlFor(t, limit, noSort){
  var cols=t.preview_cols||[];
  var known={}; cols.forEach(function(c){ known[c]=1; });
  var where=[];
  FILTERS.forEach(function(f){
    if(!known[f.col]) return;
    var c='"' + f.col.replace(/"/g,'""') + '"', k=f.kind;
    var num=function(v){ var n=Number(v); return isNaN(n)?null:String(n); };
    if(f.op==='empty'){ where.push(c+' IS NULL'); return; }
    if(f.op==='nempty'){ where.push(c+' IS NOT NULL'); return; }
    if(k==='bool'){ where.push(c+(f.op==='true'?' IS TRUE':' IS FALSE')); return; }
    if(k==='num'){
      var a=num(f.v1), b=num(f.v2);
      if(a===null) return;
      if(f.op==='between'){ if(b!==null) where.push(c+' BETWEEN '+Math.min(a,b)+' AND '+Math.max(a,b)); return; }
      var opm={eq:'=',ne:'<>',gt:'>',gte:'>=',lt:'<',lte:'<='}[f.op];
      if(opm) where.push(c+' '+opm+' '+a);
      return;
    }
    if(k==='date'){
      if(f.op==='on')     where.push(c+'::date = '+sqlLiteral(f.v1)+'::date');
      if(f.op==='before') where.push(c+' < '+sqlLiteral(f.v1));
      if(f.op==='after')  where.push(c+' > '+sqlLiteral(f.v1));
      if(f.op==='between'&&f.v2) where.push(c+' BETWEEN '+sqlLiteral(f.v1)+' AND '+sqlLiteral(f.v2));
      return;
    }
    var v=String(f.v1==null?'':f.v1);
    if(f.op==='contains')  where.push(c+'::varchar ILIKE '+sqlLiteral('%'+v+'%'));
    if(f.op==='ncontains') where.push(c+'::varchar NOT ILIKE '+sqlLiteral('%'+v+'%'));
    if(f.op==='eq')        where.push(c+'::varchar = '+sqlLiteral(v));
    if(f.op==='starts')    where.push(c+'::varchar ILIKE '+sqlLiteral(v+'%'));
    if(f.op==='ends')      where.push(c+'::varchar ILIKE '+sqlLiteral('%'+v));
  });
  var sql='SELECT * FROM '+t.schema+'.'+t.table;
  if(where.length) sql+='\nWHERE '+where.join('\n  AND ');
  if(!noSort && SORT.col && SORT.dir && known[SORT.col]) sql+='\nORDER BY "'+SORT.col.replace(/"/g,'""')+'" '+(SORT.dir>0?'ASC':'DESC');
  sql+='\nLIMIT '+limit;
  return sql;
}

function runExport(){
  var t=tableById(CUR); if(!t) return;
  var scope=document.getElementById('expScope').value;
  var fmt=document.getElementById('expFmt').value;
  var base=t.schema+'_'+t.table;
  var cols=t.preview_cols||[];

  if(scope!=='live'){
    var rows = scope==='all' ? (t.preview||[])
             : scope==='sel' ? (t.preview||[]).filter(function(_,i){ return SELECTED.has(i); })
             : viewRows(t).map(function(o){ return o.r; });
    if(!rows.length){ toast('No rows to download.'); return; }
    var out=serialise(cols, rows, fmt, base);
    download(out[0], out[1], out[2]);
    closeExport(); toast(rows.length+' rows downloaded.');
    return;
  }

  var limit=Math.max(1, Math.min(5000, parseInt(document.getElementById('expLimit').value||'5000',10)));
  liveExport(t, limit, fmt, base, false);
}

function liveExport(t, limit, fmt, base, noSort){
  var go=document.getElementById('exp-go');
  go.disabled=true; go.textContent='Querying Redshift…';
  fetch('/api/run-query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql:sqlFor(t,limit,noSort)})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      go.disabled=false; go.textContent='Download';
      if(j.error){
        var sorted = !noSort && SORT.col && SORT.dir;
        if(sorted && /timeout|timed out|canceled|cancelled/i.test(j.error)){
          /* Offer the unsorted extract rather than quietly running it: an
             unsorted 5,000 rows is a different answer from the top 5,000 by
             that column, and only the person asking can say if that will do. */
          document.getElementById('expNote').innerHTML =
              '<b style="color:var(--warnT)">Sorting ' + fmtN(t.rows||0) + ' rows by ' + esc(SORT.col)
            + ' took longer than the 20 second limit.</b><br><br>The same filters without the sort will return, '
            + 'but it gives you <b>any</b> ' + limit + ' matching rows rather than the top ' + limit + ' by '
            + esc(SORT.col) + '. Sort the file after you download it if the order matters.'
            + '<br><br><button class="gbtn on" onclick="liveExport(tableById(CUR),' + limit + ','
            + JSON.stringify(fmt) + ',' + JSON.stringify(base) + ',true)">Download without the sort</button>';
          return;
        }
        toast('Query failed: '+j.error);
        return;
      }
      if(!j.rows.length){ toast('That query returned no rows.'); return; }
      var lcols=j.columns, lrows=j.rows.map(function(o){ return lcols.map(function(c){ return o[c]; }); });
      var out2=serialise(lcols, lrows, fmt, base+(noSort?'_live_unsorted':'_live'));
      download(out2[0], out2[1], out2[2]);
      closeExport();
      toast(j.row_count+' rows downloaded from Redshift'+(noSort?', unsorted.':'.'));
    })
    .catch(function(e){
      go.disabled=false; go.textContent='Download';
      toast('Could not reach the query service. It only runs on the deployed site.');
    });
}

function summaryHTML(t){
  const s=t.summaries||[];
  if(!s.length) return '<div class="panel"><div class="empty">No column summaries baked for this table.</div></div>';
  return '<div class="sumgrid">'+s.map(su=>{
    if(su.kind==='cat'){
      const mx=Math.max(...su.top.map(x=>x[1]))||1;
      const bars=su.top.map(x=>`<div class="bar"><span class="lb" title="${esc(x[0])}">${esc(x[0])}</span><div class="tk"><div class="fl" style="width:${100*x[1]/mx}%"></div></div><span class="vn">${fmtN(x[1])}</span></div>`).join('');
      return `<div class="sumcard"><h4>${esc(su.col)} <span class="ck">categorical</span></h4><div class="st">top ${su.top.length} values</div>${bars}</div>`;
    }
    if(su.kind==='num'){
      const mx=Math.max(...(su.buckets||[]).map(b=>b[1]))||1;
      const bars=(su.buckets||[]).map(b=>`<div class="hb" style="height:${100*b[1]/mx}%" title="${esc(b[0])}: ${b[1]}"></div>`).join('');
      const labs=(su.buckets||[]).map(b=>`<span>${esc(b[0])}</span>`).join('');
      return `<div class="sumcard"><h4>${esc(su.col)} <span class="ck">numeric</span></h4>
        <div class="numrow"><div>min<b>${fmtN(su.min)}</b></div><div>avg<b>${fmtN(su.avg)}</b></div><div>max<b>${fmtN(su.max)}</b></div></div>
        <div class="histo">${bars}</div><div class="histo-lab">${labs}</div></div>`;
    }
    return `<div class="sumcard"><h4>${esc(su.col)} <span class="ck">date</span></h4><div class="st">range</div>
      <div class="numrow"><div>earliest<b>${esc(su.min)}</b></div><div>latest<b>${esc(su.max)}</b></div></div></div>`;
  }).join('')+'</div>';
}
function schemaHTML(t){
  const cols=t.columns||[];
  if(!cols.length) return '<div class="panel"><div class="empty">No schema in snapshot.</div></div>';
  return `<div class="panel"><div class="gridwrap"><table class="grid"><thead><tr><th>#</th><th>Column</th><th>Type</th></tr></thead>
    <tbody>${cols.map((c,i)=>`<tr><td>${i+1}</td><td style="color:var(--t1)">${esc(c.name)}</td><td style="color:var(--indT)">${esc(c.type)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* theme */
function applyTheme(){document.body.classList.toggle('light',THEME==='light');document.getElementById('themeBtn').innerHTML=THEME==='light'?'&#9788;':'&#9789;';}
function toggleTheme(){THEME=THEME==='light'?'dark':'light';applyTheme();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2400);}

/* Fetch live: trigger the explorer snapshot workflow via a Netlify function (token server-side) */
const EST_SECONDS=150;let _timer=null;
function lpShow(on){document.getElementById('liveProgress').style.display=on?'block':'none';}
function fmtEta(s){s=Math.round(s);if(s<=0)return'~done';const m=Math.floor(s/60);return m?`~${m}m ${s%60}s left`:`~${s}s left`;}
async function fetchLive(){
  if(_timer){toast('A live fetch is already running.');return;}
  const btn=document.getElementById('liveBtn');const old=btn.innerHTML;const before=META.generated_at;
  btn.disabled=true;btn.innerHTML='&#9889; Starting…';lpShow(true);
  document.getElementById('lpBar').style.width='4%';document.getElementById('lpEta').textContent=fmtEta(EST_SECONDS);
  let res;
  try{
    const r=await fetch(LIVE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if(r.status===202||r.ok) res={ok:true};
    else if(r.status===500){const e=await r.json().catch(()=>({}));res={ok:false,reason:e.error==='not_configured'?'Fetch-live not configured yet. Add GH_DISPATCH_TOKEN in Netlify.':(e.message||'server error')};}
    else {const e=await r.json().catch(()=>({}));res={ok:false,reason:e.message||('endpoint '+r.status)};}
  }catch(err){ res={ok:false,reason:'Endpoint unreachable.'}; }
  if(!res.ok){ lpShow(false);btn.disabled=false;btn.innerHTML=old;toast(res.reason);return; }
  toast('Live run started, querying Redshift.');btn.innerHTML='&#9889; Running…';
  const t0=Date.now();const stages=[[0,'Pipeline dispatched'],[.15,'Connecting to Redshift'],[.35,'Reading tables'],[.6,'Baking previews + summaries'],[.85,'Committing + deploying']];
  let tries=0;
  const tick=async()=>{
    const el=(Date.now()-t0)/1000,frac=Math.min(.98,el/EST_SECONDS);
    const stg=stages.filter(s=>frac>=s[0]).pop();
    document.getElementById('lpBar').style.width=(5+frac*93)+'%';
    document.getElementById('lpStage').textContent=stg?stg[1]:'working';
    document.getElementById('lpEta').textContent=fmtEta(Math.max(0,EST_SECONDS-el));
    if(el>15&&tries<60){tries++;const ok=await loadData();if(ok&&META.generated_at&&META.generated_at!==before){
      clearInterval(_timer);_timer=null;document.getElementById('lpBar').style.width='100%';
      setTimeout(()=>lpShow(false),1200);renderSidebar();renderMain();stampFreshness();
      btn.disabled=false;btn.innerHTML=old;toast('Live data in. Snapshot updated.');return;}}
    if(el>EST_SECONDS+120){clearInterval(_timer);_timer=null;lpShow(false);btn.disabled=false;btn.innerHTML=old;toast('Run dispatched; new data will appear once the pipeline commits.');}
  };
  _timer=setInterval(tick,2500);tick();
}

async function boot(){
  await loadData();
  applyTheme();stampFreshness();renderSidebar();
  if(DATA.tables.length){selectTable(DATA.tables[0].schema+'.'+DATA.tables[0].table);}
  else document.getElementById('main').innerHTML='<div class="empty">No snapshot found. Run the explorer metrics Action, or click Fetch live once configured.</div>';
}
window.addEventListener('load',boot);
</script>
