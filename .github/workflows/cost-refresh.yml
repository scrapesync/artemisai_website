name: Refresh AWS cost data

# Pakistan Standard Time is UTC+5
# 10:00 AM PKT = 05:00 UTC
# 06:00 PM PKT = 13:00 UTC
# 10:00 PM PKT = 17:00 UTC
on:
  schedule:
    - cron: '0 5 * * *'   # 10 AM PKT
    - cron: '0 13 * * *'  # 6 PM PKT
    - cron: '0 17 * * *'  # 10 PM PKT
  workflow_dispatch:       # allow manual trigger from Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed for the bot to commit data/costs.json back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3

      - name: Run cost fetcher
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SMTP_USER:             ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:         ${{ secrets.SMTP_PASSWORD }}
        run: python scripts/fetch_costs.py

      - name: Commit refreshed data
        run: |
          git config user.name  "artemis-cost-bot"
          git config user.email "actions@artemisai.co.uk"
          git add data/costs.json
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit"
          else
            git commit -m "data: refresh costs.json [skip ci]"
            git push
          fi
