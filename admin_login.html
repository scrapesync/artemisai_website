<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtemisAI</title>

<!-- Uses FB-aligned system font stack; no web fonts needed -->
<style>
/* ─── FB-aligned typography (matches index.html + mockup_v2) ─── */
:root{
  --fs-xs:11px;--fs-sm:12px;--fs-base:13px;--fs-md:14px;--fs-lg:15px;
  --fs-xl:17px;--fs-2xl:22px;--fs-3xl:28px;--fs-display:48px;--fs-display-lg:64px;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;
  --lh-tight:1.16;--lh-snug:1.33;--lh-relaxed:1.5;
  --bg:#0e1116;
  --bg-elev:#16191f;
  --bg-elev-2:#1c2128;
  --bg-input:#222831;
  --teal:#00C4A0;
  --teal-d:#00a085;
  --teal-bg:rgba(0,196,160,0.10);
  --t1:#E4E6EB;
  --t2:#B0B3B8;
  --t3:#65676B;
  --bdr:#3A3B3C;
  --bdr-soft:#2D2E30;
  --crisis:#E53935;
  --crisis-bg:rgba(229,57,53,0.10);
  --r-sm:8px;--r:12px;--r-lg:16px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow:0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,0.45);
  --t-base:120ms ease-out;
}
/* Legacy aliases (some inline styles use these) */
:root{
  --bg-primary:var(--bg);
  --bg-secondary:var(--bg-elev);
  --bg-card:var(--bg-elev);
  --accent:var(--teal);
  --accent-bright:#00f5c4;
  --accent-dim:var(--teal-bg);
  --accent-glow:rgba(0,196,160,0.35);
  --text-primary:var(--t1);
  --text-secondary:var(--t2);
  --text-muted:var(--t3);
  --border:var(--bdr-soft);
  --border-accent:rgba(0,196,160,0.15);
  --danger:var(--crisis);
  --danger-dim:var(--crisis-bg);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Roboto,Helvetica,Arial,sans-serif;font-size:var(--fs-md);line-height:var(--lh-snug);font-weight:var(--fw-regular);letter-spacing:-0.003em;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;overflow:hidden}
body::after{content:'';position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");pointer-events:none;z-index:100}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(0,212,170,0.07),transparent 70%);top:-10%;left:10%;animation:fl 14s ease-in-out infinite}
.orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,0.05),transparent 70%);bottom:-5%;right:5%;animation:fl 14s ease-in-out infinite reverse}
.orb3{width:300px;height:300px;background:radial-gradient(circle,rgba(236,72,153,0.04),transparent 70%);top:40%;right:20%;animation:fl 18s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-25px)}}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,170,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,0.02) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,black,transparent)}
.card{position:relative;z-index:10;width:100%;max-width:420px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:2.8rem 2.4rem;box-shadow:0 40px 80px rgba(0,0,0,0.5);margin:1rem}
.card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:1.8rem}
.logo-wrap svg{width:34px;height:34px}
.logo-wrap span{font-size:var(--fs-xl);font-weight:var(--fw-bold);letter-spacing:.12em}
h1{text-align:center;font-size:var(--fs-3xl);font-weight:var(--fw-bold);letter-spacing:-.02em;margin-bottom:6px;line-height:var(--lh-tight)}
.sub{text-align:center;font-size:var(--fs-md);color:var(--t2);margin-bottom:28px;font-weight:var(--fw-regular)}
.label{display:block;font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--t2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.input{width:100%;padding:12px 16px;background:var(--bg-input);border:1px solid var(--bdr-soft);border-radius:var(--r-sm);color:var(--t1);font-size:var(--fs-md);outline:none;transition:all var(--t-base);margin-bottom:14px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.input::placeholder{color:var(--text-muted)}
.btn{width:100%;padding:13px 16px;background:var(--teal);color:#0a0e13;border:none;border-radius:var(--r-sm);font-size:var(--fs-md);font-weight:var(--fw-bold);cursor:pointer;transition:all var(--t-base);position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-100%);transition:transform .5s}
.btn:hover::before{transform:translateX(100%)}
.btn:hover{background:var(--accent-bright);transform:translateY(-1px);box-shadow:0 12px 40px var(--accent-glow)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.err{display:none;text-align:center;color:var(--crisis);font-size:var(--fs-sm);margin-top:.8rem;padding:.55rem;background:var(--danger-dim);border-radius:8px;animation:shk .35s ease}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{text-align:center;font-size:var(--fs-xs);color:var(--t3);margin-top:18px}
.back{text-align:center;margin-top:1rem}
.back a{color:var(--t3);font-size:var(--fs-sm);text-decoration:none;transition:color var(--t-base)}
.back a:hover{color:var(--accent)}

nav.site-nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:68px;padding:0 2.5rem;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(24px) saturate(180%);background:rgba(6,10,19,0.88);border-bottom:1px solid rgba(255,255,255,0.05);transition:background .3s}
nav.site-nav.scrolled{background:rgba(6,10,19,0.97);box-shadow:0 4px 30px rgba(0,0,0,.3)}
.site-logo{font-size:var(--fs-md);font-weight:var(--fw-bold);letter-spacing:.12em;color:var(--t1);text-decoration:none;display:flex;align-items:center;gap:10px;flex-shrink:0}
.site-logo-mark{width:32px;height:32px}.site-logo-mark svg{width:100%;height:100%}
.site-nav-links{display:flex;align-items:center;gap:1.4rem;list-style:none;margin:0;padding:0}
.site-nav-links a{color:var(--t2);text-decoration:none;font-size:var(--fs-md);font-weight:var(--fw-medium);transition:color var(--t-base);white-space:nowrap}
.site-nav-links a:hover{color:#e8ecf4}
.nav-pill-outline{padding:8px 14px!important;border:1px solid var(--bdr)!important;border-radius:9999px;color:var(--t1)!important;font-size:var(--fs-md)!important;font-weight:var(--fw-medium)!important}
.nav-pill-outline:hover{background:rgba(0,212,170,.07)!important;border-color:rgba(0,212,170,.6)!important}
.nav-pill-solid{padding:8px 14px!important;background:var(--teal)!important;color:#0a0e13!important;border-radius:9999px;font-weight:var(--fw-bold)!important;font-size:var(--fs-md)!important}
.nav-pill-solid:hover{background:#00f5c4!important}
.nav-user-chip{display:none;align-items:center;gap:8px;padding:.35rem .9rem .35rem .5rem;background:rgba(0,212,170,.07);border:1px solid rgba(0,212,170,.2);border-radius:20px}
.nav-user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#00d4aa,#6366f1);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#060a13;flex-shrink:0}
.nav-user-name{font-family:inherit;font-size:.72rem;color:#00d4aa;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-logout-btn{background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:6px;color:rgba(255,255,255,.4);font-family:inherit;font-size:.75rem;padding:.3rem .65rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-logout-btn:hover{border-color:rgba(248,113,113,.4);color:#f87171}
.nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:4px;flex-direction:column;gap:4px}
.nav-hamburger span{display:block;width:20px;height:2px;background:#7b8ba8;border-radius:2px;transition:all .3s}
@media(max-width:768px){
  nav.site-nav{padding:0 1.2rem}
  .site-nav-links{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:rgba(6,10,19,.98);backdrop-filter:blur(20px);padding:1rem 1.5rem;gap:.6rem;border-bottom:1px solid rgba(255,255,255,.05)}
  .site-nav-links.open{display:flex}
  .nav-hamburger{display:flex}
}
.page-body{padding-top:88px}

/* ── Sign-out confirmation modal ── */
#signout-modal{display:none;position:fixed;inset:0;z-index:99998;align-items:center;justify-content:center}
#signout-modal.open{display:flex}
#signout-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px)}
#signout-card{position:relative;z-index:1;background:#0f1729;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:2rem 2.2rem;max-width:360px;width:90%;box-shadow:0 30px 60px rgba(0,0,0,0.5);animation:modalIn .2s ease}
#signout-card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(248,113,113,0.6),transparent);border-radius:0}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.signout-icon{width:44px;height:44px;border-radius:12px;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.signout-icon svg{width:20px;height:20px;stroke:#f87171;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.signout-title{text-align:center;font-size:1.05rem;font-weight:700;color:#e8ecf4;margin-bottom:.35rem}
.signout-sub{text-align:center;font-size:.82rem;color:#7b8ba8;margin-bottom:1.6rem;line-height:1.5}
.signout-btns{display:flex;gap:10px}
.signout-cancel{flex:1;padding:.7rem;background:transparent;border:1px solid rgba(255,255,255,0.1);border-radius:9px;color:#7b8ba8;font-family:inherit;font-size:.88rem;cursor:pointer;transition:all .2s}
.signout-cancel:hover{border-color:rgba(255,255,255,0.2);color:#e8ecf4}
.signout-confirm{flex:1;padding:.7rem;background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);border-radius:9px;color:#f87171;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
.signout-confirm:hover{background:rgba(248,113,113,0.2);border-color:rgba(248,113,113,0.5)}

@media(max-width:768px){
  nav.site-nav{height:48px;padding:0 1rem}
  .site-logo{font-size:.95rem;gap:.45rem}
  .site-logo-mark{width:24px;height:24px}
  .site-nav-links{gap:.6rem}
  .site-nav-links a{font-size:.75rem}
  .nav-pill-outline{padding:.3rem .7rem!important;font-size:.72rem!important}
  .nav-user-name{display:none}
  .nav-user-chip{padding:.28rem .5rem .28rem .4rem}
  .nav-logout-btn{font-size:.7rem;padding:.25rem .5rem}
  /* site-nav variants */
  .sn-logo{font-size:.95rem;gap:.45rem}

@media(max-width:480px){

}

@media(max-width:480px){
  .card{padding:2rem 1.4rem!important;margin:.5rem!important}

}

<body>

<!-- Sign-out confirmation modal -->
<div id="signout-modal">
  <div id="signout-backdrop" onclick="_closeSignoutModal()"></div>
  <div id="signout-card">
    <div class="signout-icon">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <div class="signout-title">Sign out?</div>
    <div class="signout-sub">You'll need to sign back in to access the Admin Panel.</div>
    <div class="signout-btns">
      <button class="signout-cancel" onclick="_closeSignoutModal()">Cancel</button>
      <button class="signout-confirm" onclick="_doSignout()">Sign Out</button>
    </div>
  </div>
</div>

<nav class="site-nav" id="site-nav">
    <a href="index.html" class="site-logo">
      <div class="site-logo-mark"><svg viewBox="0 0 36 36" fill="none"><rect x="2" y="2" width="32" height="32" rx="8" stroke="url(#nlg)" stroke-width="2"/><path d="M18 8L26 28H10L18 8Z" stroke="url(#nlg)" stroke-width="1.5" fill="none"/><circle cx="18" cy="20" r="3" fill="url(#nlg)"/><defs><linearGradient id="nlg" x1="4" y1="4" x2="32" y2="32"><stop stop-color="#00d4aa"/><stop offset="1" stop-color="#00a88a"/></linearGradient></defs></svg></div>
      ARTEMIS
    </a>
    <ul class="site-nav-links">
      <li><a href="admin_panel.html" class="nav-pill-outline">← Admin Panel</a></li>
      <li>
        <div class="nav-user-chip" id="nav-user-chip">
          <div class="nav-user-avatar" id="nav-user-avatar">?</div>
          <span class="nav-user-name" id="nav-user-name"></span>
        </div>
      </li>
      <li><button class="nav-logout-btn" id="nav-logout-btn" onclick="_siteLogout()" style="display:none">Sign Out</button></li>
    </ul>
  </nav>

<div class="bg-grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="card">
  <div class="logo-wrap">
    <svg viewBox="0 0 36 36" fill="none"><rect x="2" y="2" width="32" height="32" rx="8" stroke="url(#nlg)" stroke-width="2"/><path d="M18 8L26 28H10L18 8Z" stroke="url(#nlg)" stroke-width="1.5" fill="none"/><circle cx="18" cy="20" r="3" fill="url(#nlg)"/><defs><linearGradient id="nlg" x1="4" y1="4" x2="32" y2="32"><stop stop-color="#00d4aa"/><stop offset="1" stop-color="#00a88a"/></linearGradient></defs></svg>
    <span>ARTEMIS</span>
  </div>
  <h1>Admin Panel</h1>
  <p class="sub">Sign in to access the Artemis platform</p>
  <label class="label" for="u">Username</label>
  <input class="input" id="u" type="text" placeholder="Enter your username" autocomplete="username" autofocus>
  <label class="label" for="p">Password</label>
  <input class="input" id="p" type="password" placeholder="Enter your password" autocomplete="current-password">
  <button class="btn" id="btn" onclick="doLogin()">Sign In</button>
  <div class="err" id="err"></div>
  <p class="hint">Access restricted to ArtemisAI team members</p>
  <div class="back"><a href="index.html">← Back to home</a></div>
</div>
<script>
const SK = 'artemis_session';
const API = 'https://g6zr0b5lwe.execute-api.eu-west-2.amazonaws.com/default/lambda_save';

// Already logged in: route by role. Clients land on their own home, not the panel.
function homeFor(sess){ return (sess && sess.role === 'client') ? 'client_home.html' : 'admin_panel.html'; }
try{
  var _s = JSON.parse(localStorage.getItem(SK) || 'null');
  if(_s) window.location.href = homeFor(_s);
}catch{}

document.getElementById('p').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('u').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('p').focus(); });

async function doLogin(){
  const btn=document.getElementById('btn');
  const err=document.getElementById('err');
  const u=document.getElementById('u').value.trim().toLowerCase();
  const p=document.getElementById('p').value;
  if(!u||!p){ showErr('Please enter username and password'); return; }
  btn.disabled=true; btn.textContent='Signing in...'; err.style.display='none';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:u,password:p})});
    const d=await r.json();
    if(d.ok&&d.user){
      var sess={username:d.user.username,name:d.user.full_name,role:d.user.role,loginAt:new Date().toISOString()};
      localStorage.setItem(SK,JSON.stringify(sess));
      window.location.href=homeFor(sess);
    } else {
      showErr(d.error||'Invalid username or password');
      btn.disabled=false; btn.textContent='Sign In';
    }
  } catch(e){
    showErr('Connection error. Please try again.');
    btn.disabled=false; btn.textContent='Sign In';
  }
}
function showErr(m){
  const e=document.getElementById('err');
  e.textContent=m; e.style.display='block';
  e.style.animation='none'; requestAnimationFrame(()=>{e.style.animation='shk .35s ease';});
}
</script>
<script>
window.addEventListener("scroll",function(){var n=document.getElementById("site-nav");if(n)n.classList.toggle("scrolled",window.scrollY>20)});
</script>
<script>

var _signoutFn = null;
function _showSignoutModal(fn){
  _signoutFn = fn || function(){
    localStorage.removeItem('tmp');
    localStorage.removeItem('artemis_session');
    localStorage.removeItem('artemis_app_session');
    localStorage.removeItem('artemis_sprint_session');
    window.location.href='index.html';
  };
  document.getElementById('signout-modal').classList.add('open');
  document.addEventListener('keydown', _escSignout);
}
function _closeSignoutModal(){
  document.getElementById('signout-modal').classList.remove('open');
  document.removeEventListener('keydown', _escSignout);
}
function _doSignout(){
  _closeSignoutModal();
  if(_signoutFn) _signoutFn();
}
function _escSignout(e){ if(e.key==='Escape') _closeSignoutModal(); }
</script>
</body>
