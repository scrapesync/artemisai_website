<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtemisAI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect x='2' y='2' width='32' height='32' rx='8' fill='%230c1221'/><path d='M18 8L26 28H10L18 8Z' stroke='%2300d4aa' stroke-width='1.5' fill='none'/><circle cx='18' cy='20' r='3' fill='%2300d4aa'/></svg>" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-primary:#060a13;--bg-secondary:#0c1221;--bg-tertiary:#111a2e;--bg-card:#0f1729;--bg-card-hover:#142036;--accent:#00d4aa;--accent-bright:#00f5c4;--accent-secondary:#6366f1;--accent-dim:rgba(0,212,170,0.1);--accent-glow:rgba(0,212,170,0.35);--text-primary:#e8ecf4;--text-secondary:#7b8ba8;--text-muted:#4a5568;--border:rgba(255,255,255,0.05);--border-accent:rgba(0,212,170,0.15);--border-accent-strong:rgba(0,212,170,0.3);--danger:#f87171;--warning:#fbbf24;--success:#34d399}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--accent);color:var(--bg-primary)}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg-primary);color:var(--text-primary);display:flex;-webkit-font-smoothing:antialiased}
.sidebar{transform:translateZ(0);backface-visibility:hidden;width:240px;height:100vh;background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:relative;overflow:hidden}
.sidebar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:200px;background:radial-gradient(ellipse at 30% 100%,rgba(0,212,170,0.04),transparent 70%);pointer-events:none}
.sidebar-logo{padding:22px 24px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);text-decoration:none}
.sidebar-logo span{font-weight:700;font-size:15px;letter-spacing:0.12em;color:var(--text-primary)}
.sidebar-logo svg{width:32px;height:32px;flex-shrink:0}
.sidebar-nav{padding:12px;flex:1;overflow-y:auto}
.nav-group-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:0.15em;text-transform:uppercase;padding:16px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:10px;font-size:13.5px;color:var(--text-secondary);cursor:pointer;transition:all .25s;margin-bottom:1px;position:relative;border:1px solid transparent;text-decoration:none}
.nav-item:hover{background:rgba(255,255,255,0.025);color:var(--text-primary)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:var(--border-accent);font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:2px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1;stroke:var(--accent)}
.nav-badge{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;font-family:'JetBrains Mono',monospace}
.badge-ai{background:var(--accent-dim);color:var(--accent);border:1px solid var(--border-accent)}
.badge-alert{background:rgba(248,113,113,0.12);color:var(--danger);border:1px solid rgba(248,113,113,0.2)}
.main{transform:translateZ(0);flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative}
.topbar{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(6,10,19,0.6);backdrop-filter:blur(24px) saturate(180%);flex-shrink:0;position:relative;z-index:10}
.topbar-left{display:flex;align-items:center;gap:16px}
.topbar-title{font-size:17px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:14px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#00a88a);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--bg-primary);box-shadow:0 0 20px rgba(0,212,170,0.2)}
.content{flex:1;overflow-y:auto;padding:28px;position:relative;z-index:1}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--border-accent);border-radius:3px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;overflow:hidden;transition:all .15s ease-out}
.card:hover{border-color:var(--border-accent)}
.card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .15s}
.card:hover::before{opacity:1}
.card-title{font-size:14px;font-weight:600;margin-bottom:4px}
.card-subtitle{font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-bottom:16px}
.btn{padding:9px 20px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;font-family:'Outfit',sans-serif;transition:all .25s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:var(--bg-primary);box-shadow:0 4px 16px rgba(0,212,170,0.25)}
.btn-primary:hover{background:var(--accent-bright);box-shadow:0 8px 25px var(--accent-glow)}
.btn-secondary{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--border-accent);color:var(--accent)}
.btn-danger{background:rgba(248,113,113,0.1);color:var(--danger);border:1px solid rgba(248,113,113,0.2)}
.topbar-tabs{display:flex;gap:0}
.topbar-tab{padding:8px 18px;font-size:12.5px;font-weight:400;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .25s;background:none;border-top:none;border-left:none;border-right:none;font-family:'Outfit',sans-serif}
.topbar-tab:hover{color:var(--text-secondary)}
.topbar-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.section-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px}
.icon-wrap{width:40px;height:40px;background:var(--accent-dim);border:1px solid var(--border-accent);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-wrap svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.stat-big{font-size:32px;font-weight:800;color:var(--accent);letter-spacing:-0.03em;text-shadow:0 0 25px rgba(0,212,170,0.25)}
.tag{display:inline-flex;padding:4px 10px;border-radius:6px;font-size:10.5px;font-weight:500;font-family:'JetBrains Mono',monospace}
.tag-green{background:rgba(52,211,153,0.1);color:var(--success);border:1px solid rgba(52,211,153,0.2)}
.tag-red{background:rgba(248,113,113,0.1);color:var(--danger);border:1px solid rgba(248,113,113,0.2)}
.tag-yellow{background:rgba(251,191,36,0.1);color:var(--warning);border:1px solid rgba(251,191,36,0.2)}
.tag-blue{background:rgba(99,102,241,0.1);color:#a5b4fc;border:1px solid rgba(99,102,241,0.2)}
.tag-accent{background:var(--accent-dim);color:var(--accent);border:1px solid var(--border-accent)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);transition:all .2s}
.list-item:last-child{border-bottom:none}
.list-item:hover{padding-left:4px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state svg{width:48px;height:48px;stroke:var(--text-muted);fill:none;stroke-width:1;margin-bottom:16px;opacity:.5}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--bg-tertiary);border:1px solid var(--border);position:relative;cursor:pointer;transition:all .15s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle::after{content:'';width:18px;height:18px;border-radius:50%;background:white;position:absolute;top:2px;left:2px;transition:all .15s}
.toggle.on::after{left:22px}
.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;display:block}
.form-input{width:100%;padding:10px 14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:all .15s}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,170,0.08)}
select.form-input{cursor:pointer;-webkit-appearance:none}
textarea.form-input{min-height:80px;resize:vertical}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.animate{animation:fadeUp .5s ease both}
.delay-1{animation-delay:.1s}.delay-2{animation-delay:.2s}.delay-3{animation-delay:.3s}


.alert-card{background:var(--bg-card);border-radius:16px;padding:20px;display:flex;align-items:flex-start;gap:16px;transition:all .15s;cursor:pointer;margin-bottom:12px}
.alert-card:hover{transform:translateX(4px)}
.alert-card.crisis{border:1px solid rgba(248,113,113,0.2);border-left:3px solid var(--danger)}
.alert-card.performance{border:1px solid rgba(251,191,36,0.2);border-left:3px solid var(--warning)}
.alert-card.trend{border:1px solid rgba(0,212,170,0.15);border-left:3px solid var(--accent)}
.alert-card.info{border:1px solid rgba(99,102,241,0.15);border-left:3px solid var(--accent-secondary)}
.alert-badge{padding:4px 10px;border-radius:6px;font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.alert-body{flex:1}
.alert-title{font-size:13.5px;font-weight:600;margin-bottom:4px}
.alert-desc{font-size:12px;color:var(--text-secondary);line-height:1.6}
.alert-meta{display:flex;align-items:center;gap:12px;margin-top:8px}
.alert-time{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}
.alert-actions{display:flex;gap:6px;margin-left:auto}

.sidebar-signout{padding:12px 16px;border-top:1px solid var(--border);margin-top:auto;flex-shrink:0}
.sidebar-user{font-size:11px;color:var(--text-muted);padding:0 8px 8px;font-family:"JetBrains Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-signout{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;background:none;border:1px solid rgba(248,113,113,0.15);border-radius:10px;color:var(--text-secondary);font-family:"Outfit",sans-serif;font-size:13px;cursor:pointer;transition:all .15s}
.btn-signout:hover{background:rgba(248,113,113,0.08);border-color:rgba(248,113,113,0.3);color:#f87171}
.btn-signout svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}

/* ── Sign-out confirmation modal ── */
#signout-modal{display:none;position:fixed;inset:0;z-index:99998;align-items:center;justify-content:center}
#signout-modal.open{display:flex}
#signout-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px)}
#signout-card{position:relative;z-index:1;background:#0f1729;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:2rem 2.2rem;max-width:360px;width:90%;box-shadow:0 30px 60px rgba(0,0,0,0.5);animation:modalIn .2s ease}
#signout-card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(248,113,113,0.6),transparent);border-radius:0}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.signout-icon{width:44px;height:44px;border-radius:12px;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.signout-icon svg{width:20px;height:20px;stroke:#f87171;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.signout-title{text-align:center;font-size:1.05rem;font-weight:700;color:#e8ecf4;margin-bottom:.35rem}
.signout-sub{text-align:center;font-size:.82rem;color:#7b8ba8;margin-bottom:1.6rem;line-height:1.5}
.signout-btns{display:flex;gap:10px}
.signout-cancel{flex:1;padding:.7rem;background:transparent;border:1px solid rgba(255,255,255,0.1);border-radius:9px;color:#7b8ba8;font-family:inherit;font-size:.88rem;cursor:pointer;transition:all .2s}
.signout-cancel:hover{border-color:rgba(255,255,255,0.2);color:#e8ecf4}
.signout-confirm{flex:1;padding:.7rem;background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);border-radius:9px;color:#f87171;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
.signout-confirm:hover{background:rgba(248,113,113,0.2);border-color:rgba(248,113,113,0.5)}

@media(max-width:768px){
  .sidebar{transform:translateZ(0);backface-visibility:hidden;display:none!important}
  .main-content{margin-left:0!important}
  .topbar{padding:0 12px!important}
}

/* ═══════════════════════════════════════════════
   
/* ─────────────────────────────────────────────────────────
   ARTEMISAI SHARED MOBILE — injected into all pages
   ───────────────────────────────────────────────────────── */
@media(max-width:768px){
  /* Site nav */
  nav.site-nav{height:52px!important;padding:0 1rem!important}
  .site-logo{font-size:.95rem!important;gap:.5rem!important}
  .site-logo-mark{width:26px!important;height:26px!important}
  .site-nav-links{gap:.5rem!important}
  .nav-pill-outline{padding:.3rem .75rem!important;font-size:.72rem!important}
  .nav-user-name{max-width:70px!important;overflow:hidden!important;text-overflow:ellipsis!important}
  /* sn-* variant (sprint tracker) */
  .sn-links{gap:.5rem!important}
  .sn-pill{padding:.3rem .75rem!important;font-size:.7rem!important}
  .sn-name{max-width:70px!important;overflow:hidden!important;text-overflow:ellipsis!important}
  /* Sign-out modal */
  #signout-card{padding:1.6rem 1.4rem!important;max-width:320px!important}
}
@media(max-width:480px){
  .nav-user-name,.sn-name{display:none!important}
  .nav-user-avatar,.sn-avatar{width:26px!important;height:26px!important;font-size:10px!important}
}

/* ─────────────────────────────────────────────────────────
   ARTEMISAI MOCKUP APP — MOBILE (all 9 mockup pages)
   Pattern: sidebar hidden → full-width content → bottom nav
   ───────────────────────────────────────────────────────── */


.m-bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:500;
  background:rgba(6,10,19,.97);
  backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.08);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));
  justify-content:space-around;align-items:flex-end;
}
.m-bottom-nav a{
  display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:6px 0;min-width:52px;
  color:rgba(255,255,255,.38);text-decoration:none;
  font-size:9.5px;font-family:'JetBrains Mono',monospace;
  letter-spacing:.02em;transition:color .18s;
  -webkit-tap-highlight-color:transparent;
}
.m-bottom-nav a.active{color:var(--accent,#00d4aa)}
.m-bottom-nav a svg{
  width:22px;height:22px;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .18s;
}
.m-bottom-nav a.active svg{transform:scale(1.12)}

/* Admin panel back pill — shown on mobile at top */
.m-admin-back{
  display:none;
  align-items:center;gap:6px;
  padding:8px 14px;
  background:rgba(0,212,170,.05);
  border-bottom:1px solid rgba(0,212,170,.12);
  font-size:11px;font-family:'JetBrains Mono',monospace;
  color:rgba(0,212,170,.75);text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.m-admin-back svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Mobile page tabs — horizontal scroll strip */

.m-page-tabs::-webkit-scrollbar{display:none}



@media(max-width:768px){
  /* Core layout */
  body{overflow-x:hidden!important}
  .sidebar{transform:translateZ(0);backface-visibility:hidden;display:none!important}
  .main{transform:translateZ(0);
    margin-left:0!important;width:100%!important;
    height:auto!important;min-height:100vh!important;
    display:flex!important;flex-direction:column!important;
  }
  
  /* Topbar */
  .topbar{
    height:52px!important;padding:0 14px!important;
    flex-shrink:0!important;
    position:sticky!important;top:0!important;z-index:100!important;
  }
  .topbar-title{font-size:15px!important;font-weight:600!important}
  /* topbar tabs: handled by design system */
  .topbar-right > *:not(.avatar):not(.page-selector){
    display:none!important;
  }
  .avatar{
    width:32px!important;height:32px!important;
    font-size:11px!important;flex-shrink:0!important;
  }
  .page-selector{max-width:160px!important}
  
  /* Mobile elements: show */
  .m-bottom-nav{display:flex!important}
  .m-admin-back{display:flex!important}
  
  
  /* Content area */
  .content{
    padding:14px 14px 80px!important;
    flex:1!important;overflow-y:auto!important;
  }
  
  /* 4-col KPI grid → 2×2 */
  .grid-4,.kpi-grid,
  [class*="stats-grid"]{
    grid-template-columns:1fr 1fr!important;
    gap:10px!important;
  }
  
  /* 3-col grids → 1-col */
  .grid-3,
  [class*="grid-3"]{
    grid-template-columns:1fr!important;
    gap:12px!important;
  }
  
  /* 2-col grids → keep on most phones, collapse on tiny */
  .grid-2,[class*="grid-2"]{
    grid-template-columns:1fr 1fr!important;
    gap:10px!important;
  }
  
  /* Large 2-col splits (5fr 3fr etc) → stack */
  .chart-row,.insight-row,.main-split{
    grid-template-columns:1fr!important;
    gap:12px!important;
  }
  
  /* Cards */
  .card{border-radius:10px!important;padding:14px!important}
  .seg-card{border-radius:10px!important;padding:14px 12px!important}
  
  /* KPI stat values */
  .stat-val,.kpi-val,.stat-value,.big-val{
    font-size:1.4rem!important;
  }
  .stat-label,.kpi-label,.stat-sub{
    font-size:.65rem!important;
  }
  
  /* Charts: full width, cap height */
  [class*="chart"]{width:100%!important;min-width:0!important}
  .sparkline-container{width:100%!important}
  
  /* Tags */
  .tag{font-size:.62rem!important;padding:3px 7px!important}
  
  /* Section labels */
  .section-label{font-size:.72rem!important;margin-bottom:10px!important}
  
  /* Alerts */
  .alert-card{border-radius:10px!important;padding:14px!important}
  
  /* Tables → scroll */
  .table-wrap,table{
    display:block!important;overflow-x:auto!important;
    -webkit-overflow-scrolling:touch!important;
    width:100%!important;
  }
  
  /* Settings layout (sidebar + panel) */
  .settings-layout{
    grid-template-columns:1fr!important;
    flex-direction:column!important;
  }
  .settings-nav{
    display:flex!important;flex-direction:row!important;
    overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;
    scrollbar-width:none!important;
    gap:4px!important;padding:8px 0!important;
    border-right:none!important;border-bottom:1px solid rgba(255,255,255,.07)!important;
    flex-shrink:0!important;
  }
  .settings-nav::-webkit-scrollbar{display:none!important}
  .settings-nav-item{
    flex-shrink:0!important;white-space:nowrap!important;
    font-size:10px!important;padding:6px 12px!important;
  }
  .settings-panel{padding:14px 0!important;min-width:0!important}
  
  /* Connected pages grid */
  .pages-grid{grid-template-columns:1fr!important}
  .page-card{border-radius:10px!important;padding:14px!important}
  
  /* Art-E chat */
  .chat-container{padding-bottom:80px!important}
  .chat-input-area{padding:10px 14px!important}
  .chat-input{font-size:14px!important}
  
  /* Discovery feed */
  .flywheel-grid,.discovery-grid{
    grid-template-columns:1fr!important;gap:12px!important;
  }
  .flywheel-card{border-radius:10px!important}
  
  /* Reports */
  .report-card{border-radius:10px!important;padding:14px!important}
  
  /* Predictions — score ring: centre it */
  .score-ring{margin:0 auto 12px!important}
  .pred-card{text-align:center!important}
  
  /* List items */
  .list-item{padding:10px 0!important;gap:10px!important}
  .list-item button{font-size:10px!important;padding:5px 10px!important}
}

  /* Very small phones */

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
// ── ANALYST UTILITIES ──────────────────────────────────────────────
(function(){

// Registry of chart data for export
window._CHART_DATA = {};

// Download CSV helper
window.downloadCSV = function(rows, filename){
  const csv = rows.map(r => r.map(c => {
    const s = String(c).replace(/"/g,'""');
    return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename || 'artemis-export.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

// Export chart by canvas ID
window.exportChart = function(canvasId, title){
  const reg = window._CHART_DATA[canvasId];
  if(reg){ downloadCSV(reg, (title||canvasId)+'.csv'); return; }

  // Fall back to Chart.js instance
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const chart = Chart.getChart ? Chart.getChart(canvas) : canvas._chartInstance;
  if(!chart){ alert('No chart data found for export'); return; }

  const labels = chart.data.labels || [];
  const datasets = chart.data.datasets || [];
  const headers = ['Label', ...datasets.map(d=>d.label||'Value')];
  const rows = [headers];
  labels.forEach((lbl,i)=>{
    rows.push([lbl, ...datasets.map(d=> d.data && d.data[i] !== undefined ? d.data[i] : '')]);
  });
  downloadCSV(rows, (title||canvasId)+'.csv');
};

// Export data table by table ID
window.exportTable = function(tableId, title){
  const tbl = document.getElementById(tableId);
  if(!tbl) return;
  const rows = [];
  tbl.querySelectorAll('tr').forEach(tr=>{
    rows.push([...tr.querySelectorAll('th,td')].map(c=>c.innerText.trim()));
  });
  downloadCSV(rows, (title||tableId)+'.csv');
};

// Export all visible charts + tables on page
window.exportAll = function(){
  const page = location.pathname.split('/').pop().replace('.html','');
  const allRows = [['Artemis Analytics Export', '', '', ''],
                   ['Page', page, '', ''],
                   ['Exported at', new Date().toISOString(), '', ''],
                   ['', '', '', '']];

  // All canvases with charts
  document.querySelectorAll('canvas[id]').forEach(canvas=>{
    const chart = Chart.getChart ? Chart.getChart(canvas) : null;
    if(!chart) return;
    const labels = chart.data.labels || [];
    const datasets = chart.data.datasets || [];
    if(!labels.length && !datasets.length) return;
    allRows.push([canvas.id.toUpperCase(), '', '', '']);
    allRows.push(['Label', ...datasets.map(d=>d.label||'Value')]);
    labels.forEach((lbl,i)=>{
      allRows.push([lbl, ...datasets.map(d=> d.data?.[i] ?? '')]);
    });
    allRows.push(['','','','']);
  });

  // All data tables
  document.querySelectorAll('table.data-table').forEach((tbl,ti)=>{
    allRows.push([`TABLE_${ti+1}`, '', '', '']);
    tbl.querySelectorAll('tr').forEach(tr=>{
      allRows.push([...tr.querySelectorAll('th,td')].map(c=>c.innerText.trim()));
    });
    allRows.push(['','','','']);
  });

  downloadCSV(allRows, page+'-full-export-'+new Date().toISOString().slice(0,10)+'.csv');
};

})();
</script>

<script>

var _signoutFn = null;
function _showSignoutModal(fn){
  _signoutFn = fn || function(){
    localStorage.removeItem('tmp');
    localStorage.removeItem('artemis_session');
    localStorage.removeItem('artemis_app_session');
    localStorage.removeItem('artemis_sprint_session');
    window.location.href='index.html';
  };
  document.getElementById('signout-modal').classList.add('open');
  document.addEventListener('keydown', _escSignout);
}
function _closeSignoutModal(){
  document.getElementById('signout-modal').classList.remove('open');
  document.removeEventListener('keydown', _escSignout);
}
function _doSignout(){
  _closeSignoutModal();
  if(_signoutFn) _signoutFn();
}
function _escSignout(e){ if(e.key==='Escape') _closeSignoutModal(); }
</script>

<script>
// Add mobile tabs below topbar based on current page
(function(){
  function addMobileTabs(){
    const tabs = {
      'mockup_dashboard.html': ['KPIs','Trends','Virality','Sentiment'],
      'mockup_audience.html':  ['Segments','Demographics','Affinity'],
      'mockup_settings.html':  ['Profile','Notifications','API Keys'],
      'mockup_alerts.html':    ['All','Crisis','Performance','Trends'],
    };
    const page = location.pathname.split('/').pop();
    const pageTabs = tabs[page];
    if(!pageTabs) return;
    const topbar = document.querySelector('.topbar');
    if(!topbar) return;
    const row = document.createElement('div');
    row.className = 'mobile-tabs';
    pageTabs.forEach((t,i) => {
      const btn = document.createElement('button');
      btn.textContent = t;
      btn.style.cssText = 'flex-shrink:0;padding:6px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.5);font-family:"JetBrains Mono",monospace;font-size:10px;cursor:pointer;white-space:nowrap;transition:all .2s';
      if(i===0){btn.style.borderColor='var(--accent,#00d4aa)';btn.style.color='var(--accent,#00d4aa)';btn.style.background='rgba(0,212,170,.08)';}
      btn.onclick = function(){
        row.querySelectorAll('button').forEach(b=>{b.style.borderColor='rgba(255,255,255,.1)';b.style.color='rgba(255,255,255,.5)';b.style.background='transparent';});
        this.style.borderColor='var(--accent,#00d4aa)';this.style.color='var(--accent,#00d4aa)';this.style.background='rgba(0,212,170,.08)';
        // Try to click the desktop tab
        const desktopTabs = document.querySelectorAll('.topbar-tab');
        if(desktopTabs[i]) desktopTabs[i].click();
      };
      row.appendChild(btn);
    });
    topbar.insertAdjacentElement('afterend', row);
  }
  if(window.innerWidth<=768) addMobileTabs();
  window.addEventListener('resize', function(){
    if(window.innerWidth<=768 && !document.querySelector('.mobile-tabs')) addMobileTabs();
  });
})();
</script>
